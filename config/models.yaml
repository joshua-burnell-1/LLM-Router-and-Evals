# Model registry. Prices are USD per 1M tokens (standard tier, prompts under the long-context
# threshold). `backend: auto` uses the provider API key through LiteLLM when it is set, and
# otherwise falls back to the local `claude` CLI for Claude models (your Claude plan).
#
# Enabled models with no way to call them (no key, no CLI) are skipped by `routewise eval`.
#
# Claude prices verified 2026-10-14 against the list-price cost basis the claude CLI reports.
# OpenAI model ids verified 2026-10-15 against the /v1/models API. OpenAI and Gemini PRICES come
# from third-party trackers (Oct 2026) and are NOT verified against the providers' own pricing
# pages (price_verified: false). Check https://openai.com/api/pricing and
# https://ai.google.dev/pricing before trusting their cost figures. Gemini ids are unverified,
# so Gemini stays disabled.

models:
  - id: claude-opus-5-5
    name: Claude Opus 5.5
    provider: anthropic
    litellm_model: anthropic/claude-opus-5-5
    cli_model: opus
    input_price: 4.00
    output_price: 20.00
    tier: flagship

  - id: claude-sonnet-5-5
    name: Claude Sonnet 5.5
    provider: anthropic
    litellm_model: anthropic/claude-sonnet-5-5
    cli_model: sonnet
    input_price: 2.00
    output_price: 10.00
    tier: mid

  - id: claude-haiku-5-5
    name: Claude Haiku 5.5
    provider: anthropic
    litellm_model: anthropic/claude-haiku-5-5
    cli_model: haiku
    input_price: 0.10
    output_price: 0.50
    tier: budget

  - id: gpt-6-astra
    name: GPT-6 Astra
    provider: openai
    litellm_model: openai/gpt-6-astra
    input_price: 10.00  # UNVERIFIED price
    output_price: 50.00
