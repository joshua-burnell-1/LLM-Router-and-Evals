    provider: openai
    litellm_model: openai/gpt-6.1-sol
    input_price: 2.00  # UNVERIFIED price
    output_price: 10.00
    tier: mid
    price_verified: false

  - id: gpt-6-luna
    name: GPT-6 Luna
    provider: openai
    litellm_model: openai/gpt-6-luna
    input_price: 0.10  # UNVERIFIED price
    output_price: 0.50
