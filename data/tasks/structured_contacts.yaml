# Contact extraction from noisy email footers, scored by slot F1.
suite: scale-contacts
category: structured_output
tags: [templated, extraction]
templates:
  - id: contact-{{i}}
    prompt: |-
      Extract the sender's contact details from this email footer as JSON with keys
      "name", "title", "company" and "email". Return only the JSON object.

      ---
      {{footer}}
    scoring:
      - type: slot_f1
        params:
          gold: {name: "{{name}}", title: "{{title}}", company: "{{company}}", email: "{{email}}"}
    reference_output: '{"name": "{{name}}", "title": "{{title}}", "company": "{{company}}", "email": "{{email}}"}'
    cases:
      - name: Aisha Bello
        title: VP of Partnerships
        company: Lumen Freight
        email: aisha.bello@lumenfreight.com
        footer: "Best,\nAisha Bello | VP of Partnerships\nLumen Freight - moving what matters\naisha.bello@lumenfreight.com | Sent from my phone, pls excuse typos"
      - name: Tomás Ruiz
        title: Staff Engineer, Platform
        company: Quarry Labs
        email: truiz@quarrylabs.io
        footer: "--\nTomás Ruiz\nStaff Engineer, Platform\nQuarry Labs\nPronouns: he/him\nwork: truiz@quarrylabs.io (personal: tomas.r.dev@gmail.com, don't use for work stuff)"
      - name: Grace Liu
